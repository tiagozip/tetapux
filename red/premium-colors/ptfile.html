      body {
        max-width: 414px;
        margin: 0 auto;
        position: relative;
        min-height: 100vh;
        background-size: 100% 100%;
      }

      #footer {
        width: 100%;
        background-color: transparent;
        padding: 5px 0;
        text-align: center;
        position: absolute;
        bottom: 10px;
        left: 0;
      }

      #footer span,
      #footer a {
        color: #5e5e5e;
        display: inline-block;
        font-family: Verdana, Geneva, sans-serif;
        font-size: 12px;
        text-decoration: none;
      }
      #main-content {
        text-align: center;
        width: 100%;
        height: 100vh;
        background-color: #fff;
      }

      h1 {
        font-family: Verdana, Geneva, sans-serif;
        font-weight: bold;
        color: #5e5e5e;
        font-size: 26px;
        padding-top: 26px;
        line-height: 30px;
        width: 100%;
      }

      p {
        font-family: Verdana, Geneva, sans-serif;
        font-weight: bold;
        color: #5e5e5e;
        font-size: 14px;
      }

      #cost_text {
        font-size: 12px;
      }

      button {
        width: 90%;
        margin: 10px auto;
        background: linear-gradient(to right, #00ff22, #a8ff8a);
        height: 50px;
        font-size: 22px;
        font-family: Verdana, Geneva, sans-serif;
        font-weight: bold;
        border-radius: 15px;
        color: #000;
        border: none;
        cursor: pointer;
      }

      #header {
        width: 100%;
        background-color: #4ac144;
      }

      #logo {
        width: 170px;
        margin: 15px 0 10px 0;
      }

      a {
        text-decoration: none;
      }

      #main-img {
        width: 60%;
        margin: 10px auto 10px auto;
        max-width: 300px;
        animation: pulse 1s infinite;
      }

      @keyframes pulse {
        0% {
          transform: scale(0.95);
        }

        70% {
          transform: scale(1);
        }

        100% {
          transform: scale(0.95);
        }
      }

      #main-content {
        min-height: 560px;
      }
